apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer
  namespace: taskflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer-edit
  namespace: taskflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer
    namespace: taskflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-deployer-monitoring
  namespace: taskflow
rules:
  - apiGroups: ["operator.victoriametrics.com"]
    resources: ["vmservicescrapes", "vmrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer-monitoring
  namespace: taskflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-deployer-monitoring
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer
    namespace: taskflow