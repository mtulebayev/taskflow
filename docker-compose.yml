services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    image: taskflow:local
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: taskflow:local
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskflow
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: